name: Build and release APK

on:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'root/**'
      - 'htdocs/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Test controller and LuCI contracts
        run: |
          python3 tests/integration.py
          python3 tests/package.py
          node tests/luci.js
      - name: Install official SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev patch rsync unzip zlib1g-dev file wget python3 zstd
      - name: Build with pinned OpenWrt 25.12.6 SDK
        run: bash scripts/build-sdk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-rpi-fan-apk
          path: release/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: luci-app-rpi-fan-apk
          path: release
      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; leaving its files unchanged. New build remains in Actions artifacts."
            exit 0
          fi
          gh release create "v$version" release/* \
            --target "$GITHUB_SHA" \
            --title "v$version — OpenWrt 25.12 APK" \
            --notes-file docs/RELEASE-NOTES.md
